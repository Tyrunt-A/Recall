<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemelo Digital — Tyrone</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0b;
    --surface:   #111114;
    --border:    #1e1e24;
    --border2:   #2a2a33;
    --text:      #e2e0d8;
    --muted:     #666670;
    --accent:    #c8a96e;
    --accent2:   #7c6fcd;
    --gemelo:    #1a1a20;
    --user:      #141418;
    --danger:    #c06060;
    --success:   #6a9e6a;
    --radius:    12px;
    --font-ui:   'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-title {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .header-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-icon:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-icon.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(124, 111, 205, 0.08);
  }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    gap: 4px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.gemelo { align-self: flex-start; align-items: flex-start; }
  .msg.sistema { align-self: center; align-items: center; }

  .msg-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 4px;
  }

  .msg.user .msg-label { color: var(--accent); }
  .msg.gemelo .msg-label { color: var(--accent2); }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-bubble {
    background: var(--user);
    border: 1px solid var(--border2);
    border-bottom-right-radius: 3px;
  }

  .msg.gemelo .msg-bubble {
    background: var(--gemelo);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  .msg.sistema .msg-bubble {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
  }

  .msg-bubble img {
    max-width: 280px;
    max-height: 200px;
    border-radius: 8px;
    display: block;
    margin-bottom: 8px;
    object-fit: contain;
  }

  .msg.gemelo .msg-bubble em,
  .msg.gemelo .msg-bubble i {
    color: var(--muted);
    font-style: italic;
  }

  /* ── Thinking indicator ── */
  .thinking {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: var(--gemelo);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 3px;
    width: fit-content;
  }

  .thinking span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.2s ease-in-out infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ── Drop zone ── */
  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 11, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--accent);
    font-family: var(--font-ui);
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  #drop-overlay.active { display: flex; }

  /* ── Image preview ── */
  #img-preview-bar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #img-preview-bar.visible { display: flex; }

  #img-preview-bar img {
    height: 48px;
    width: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border2);
  }

  #img-preview-bar .img-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }

  #img-preview-bar button {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }

  /* ── Input area ── */
  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #input-wrap {
    flex: 1;
    position: relative;
  }

  #msg-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: var(--radius);
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }

  #msg-input:focus { border-color: var(--accent2); }
  #msg-input::placeholder { color: var(--muted); }

  .send-btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    width: 46px;
    height: 46px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 18px;
  }

  .send-btn:hover { background: #d4b87a; transform: scale(1.03); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .attach-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    width: 46px;
    height: 46px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 18px;
  }

  .attach-btn:hover { border-color: var(--accent); color: var(--accent); }

  #file-input { display: none; }

  /* ── Hint bar ── */
  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 6px;
    letter-spacing: 0.04em;
  }

  /* ── Modal memoria ── */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  #modal.open { display: flex; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-height: 70vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-box h2 {
    font-family: var(--font-ui);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .stat-row .label { color: var(--muted); }
  .stat-row .value { color: var(--accent); font-weight: 500; }

  .modal-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .modal-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .modal-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    align-self: flex-end;
    margin-top: -8px;
  }

  /* ── Cámara oculta para captura ── */
  #cam-video { display: none; }
  #cam-canvas { display: none; }
</style>
</head>
<body>

<!-- Drop overlay -->
<div id="drop-overlay">
  <span>Suelta la imagen aquí</span>
</div>

<!-- Cámara oculta — solo para captura en saludos -->
<video id="cam-video" autoplay playsinline muted></video>
<canvas id="cam-canvas"></canvas>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="status-dot"></div>
    <div>
      <div class="header-title">Gemelo Digital</div>
      <div class="header-sub">Tyrone Antonio Rivero — v0.1</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btn-verbose" onclick="toggleVerbose()">verbose</button>
    <button class="btn-icon" onclick="openModal()">memoria</button>
    <button class="btn-icon" onclick="toggleRegistro()">+ rostro</button>
    <button class="btn-icon" onclick="cerrarSesion()" style="border-color: #c06060; color: #c06060;">cerrar sesión</button>
  </div>
</header>

<!-- Chat -->
<div id="chat">
  <div class="msg sistema">
    <div class="msg-bubble">Gemelo activo. Escribe un mensaje o arrastra una imagen.</div>
  </div>
</div>

<!-- Image preview bar -->
<div id="img-preview-bar">
  <img id="img-preview-thumb" src="" alt="preview">
  <span class="img-name" id="img-preview-name">imagen.png</span>
  <button onclick="clearImage()" title="Quitar imagen">✕</button>
</div>

<!-- Registro de rostro -->
<div id="registro-bar" style="display:none;align-items:center;gap:10px;padding:8px 24px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-shrink:0;">
  <span>Registrar como:</span>
  <input type="text" id="registro-nombre" placeholder="Nombre" value="Camila"
    style="background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:6px 10px;border-radius:6px;outline:none;width:120px;">
  <button onclick="registrarRostro()"
    style="background:none;border:1px solid var(--accent2);color:var(--accent2);font-family:var(--font-mono);font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;">
    📷 Capturar y registrar
  </button>
  <button onclick="document.getElementById('registro-bar').style.display='none'"
    style="background:none;border:1px solid var(--danger);color:var(--danger);font-family:var(--font-mono);font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;">
    ✕
  </button>
</div>

<!-- Input -->
<div id="input-area">
  <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Adjuntar imagen">
    &#128247;
  </button>
  <input type="file" id="file-input" accept="image/*" onchange="handleFileInput(this)">
  <div id="input-wrap">
    <textarea
      id="msg-input"
      placeholder="Escribe un mensaje... (Ctrl+V para pegar imagen)"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">&#8593;</button>
</div>
<div class="hint">Enter para enviar · Shift+Enter para nueva línea · Ctrl+V para pegar imagen</div>

<!-- Modal memoria -->
<div id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>Memoria</h2>
    <div id="modal-stats">Cargando...</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="modal-btn" onclick="cmdMemoria('buscar')">🔍 Buscar en memoria</button>
      <button class="modal-btn" onclick="cmdMemoria('listar')">📋 Listar memorias recientes</button>
      <button class="modal-btn danger" onclick="cmdMemoria('limpiar')">⚠ Limpiar historial activo</button>
    </div>
  </div>
</div>

<script>
// ── Estado ──────────────────────────────────────────────────────────────────
let pendingImage = null;
let verboseOn    = false;
let sending      = false;

// ── Saludos (mismo set que en agente.py) ────────────────────────────────────
const SALUDOS = [
  "hola", "buenas", "hey", "qué tal", "buenos días", "buenas tardes",
  "buenas noches", "epa", "épale", "ey", "hello", "hi", "ola"
];

function esSaludo(texto) {
  const t = texto.toLowerCase().trim();
  return SALUDOS.some(s => t.startsWith(s));
}

// ── Cámara del cliente ───────────────────────────────────────────────────────
let cameraStream = null;

async function capturarFotoDesdeCliente() {
  /**
   * Abre la cámara del dispositivo, captura un frame y lo devuelve como base64.
   * Si el usuario deniega el permiso, devuelve null sin romper el flujo.
   */
  try {
    const video  = document.getElementById('cam-video');
    const canvas = document.getElementById('cam-canvas');

    // Pedir permiso y abrir stream
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 }
    });
    video.srcObject = cameraStream;

    // Esperar a que el video tenga datos reales
    await new Promise((resolve) => {
      video.onloadeddata = resolve;
      setTimeout(resolve, 2000); // fallback por si el evento no llega
    });

    // Capturar frame
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);

    // Convertir a base64 (sin el prefijo data:image/jpeg;base64,)
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const b64 = dataUrl.split(',')[1];

    return b64;

  } catch (err) {
    // Permiso denegado o cámara no disponible — flujo continúa sin imagen
    console.warn('[cam] No se pudo capturar:', err.message);
    return null;
  } finally {
    // Siempre cerrar el stream para apagar la cámara
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }
}

// ── Autosize textarea ────────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ── Enter/Shift+Enter ────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Ctrl+V — pegar imagen del portapapeles ────────────────────────────────────
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      loadImageFile(file);
      return;
    }
  }
});

// ── Drag & drop ──────────────────────────────────────────────────────────────
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.add('active');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) {
    document.getElementById('drop-overlay').classList.remove('active');
  }
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    loadImageFile(file);
  }
});

// ── Input file ───────────────────────────────────────────────────────────────
function handleFileInput(input) {
  const file = input.files[0];
  if (file) loadImageFile(file);
  input.value = '';
}

// ── Cargar imagen ─────────────────────────────────────────────────────────────
function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const b64 = dataUrl.split(',')[1];
    pendingImage = {
      b64,
      mediaType: file.type || 'image/png',
      name: file.name || 'imagen.png',
      previewUrl: dataUrl
    };
    showImagePreview();
  };
  reader.readAsDataURL(file);
}

function showImagePreview() {
  if (!pendingImage) return;
  document.getElementById('img-preview-thumb').src = pendingImage.previewUrl;
  document.getElementById('img-preview-name').textContent = pendingImage.name;
  document.getElementById('img-preview-bar').classList.add('visible');
}

function clearImage() {
  pendingImage = null;
  document.getElementById('img-preview-bar').classList.remove('visible');
  document.getElementById('img-preview-thumb').src = '';
}

// ── Enviar mensaje ────────────────────────────────────────────────────────────
async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('msg-input');
  const texto = input.value.trim();

  if (!texto && !pendingImage) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;

  const displayText = texto || '(imagen)';
  addMessage('user', displayText, pendingImage?.previewUrl);

  input.value = '';
  input.style.height = 'auto';

  const thinkingId = addThinking();

  try {
    let data;

    if (pendingImage) {
      // Enviar con imagen adjunta manualmente
      const resp = await fetch('/imagen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imagen_b64: pendingImage.b64,
          media_type: pendingImage.mediaType,
          mensaje: texto || '¿Qué ves en esta imagen?'
        })
      });
      data = await resp.json();
      clearImage();

    } else if (esSaludo(texto)) {
      // Saludo → capturar cámara del dispositivo actual y mandar con el mensaje
      const fotoB64 = await capturarFotoDesdeCliente();
      const body = { mensaje: texto };
      if (fotoB64) body.imagen_b64 = fotoB64;

      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      data = await resp.json();

    } else {
      // Mensaje normal sin imagen
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto })
      });
      data = await resp.json();
    }

    removeThinking(thinkingId);

    if (data.tipo === 'error') {
      addMessage('sistema', '⚠ ' + data.respuesta);
    } else if (data.tipo === 'comando') {
      addMessage('sistema', data.respuesta);
    } else {
      addMessage('gemelo', data.respuesta);
    }

  } catch (err) {
    removeThinking(thinkingId);
    addMessage('sistema', '⚠ Error de conexión: ' + err.message);
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

// ── Agregar mensaje al chat ───────────────────────────────────────────────────
function addMessage(tipo, texto, imgUrl) {
  const chat = document.getElementById('chat');

  const div = document.createElement('div');
  div.className = `msg ${tipo}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = tipo === 'user' ? 'Tú' : tipo === 'gemelo' ? 'Gemelo' : 'Sistema';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    bubble.appendChild(img);
  }

  const formatted = texto.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const textNode = document.createElement('span');
  textNode.innerHTML = formatted;
  bubble.appendChild(textNode);

  div.appendChild(label);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── Thinking dots ─────────────────────────────────────────────────────────────
let thinkingCounter = 0;

function addThinking() {
  const chat = document.getElementById('chat');
  const id = 'thinking-' + (++thinkingCounter);

  const wrapper = document.createElement('div');
  wrapper.className = 'msg gemelo';
  wrapper.id = id;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Gemelo';

  const dots = document.createElement('div');
  dots.className = 'thinking';
  dots.innerHTML = '<span></span><span></span><span></span>';

  wrapper.appendChild(label);
  wrapper.appendChild(dots);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;

  return id;
}

function removeThinking(id) {
  document.getElementById(id)?.remove();
}

// ── Registro de rostro ───────────────────────────────────────────────────────
function toggleRegistro() {
  const bar = document.getElementById('registro-bar');
  bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
}

async function registrarRostro() {
  const nombre = document.getElementById('registro-nombre').value.trim();
  if (!nombre) { addMessage('sistema', '⚠ Escribe un nombre primero.'); return; }

  addMessage('sistema', `Abriendo cámara para registrar a ${nombre}...`);

  const fotoB64 = await capturarFotoDesdeCliente();
  if (!fotoB64) {
    addMessage('sistema', '⚠ No se pudo acceder a la cámara.');
    return;
  }

  addMessage('sistema', 'Procesando embedding...');

  try {
    const resp = await fetch('/registrar_rostro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imagen_b64: fotoB64, nombre, media_type: 'image/jpeg' })
    });
    const data = await resp.json();
    if (data.ok) {
      addMessage('sistema', `✓ ${data.mensaje}`);
      document.getElementById('registro-bar').style.display = 'none';
    } else {
      addMessage('sistema', `⚠ ${data.error}`);
    }
  } catch (err) {
    addMessage('sistema', '⚠ Error al registrar: ' + err.message);
  }
}

// ── Verbose ───────────────────────────────────────────────────────────────────
async function toggleVerbose() {
  await fetch('/verbose', { method: 'POST' });
  verboseOn = !verboseOn;
  const btn = document.getElementById('btn-verbose');
  btn.classList.toggle('active', verboseOn);
  addMessage('sistema', `Verbose: ${verboseOn ? 'ON' : 'OFF'}`);
}


async function cerrarSesion() {
  if (!confirm('¿Cerrar sesión? Se guardará el historial y se generará un resumen.')) return;

  addMessage('sistema', 'Cerrando sesión...');

  try {
    const resp = await fetch('/cerrar_sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: 'ty' })
    });

    const data = await resp.json();

    if (data.status === 'ok') {
      addMessage('sistema', '✓ Sesión cerrada. Resumen guardado.');
    } else {
      addMessage('sistema', '⚠ Error al cerrar sesión: ' + data.mensaje);
    }
  } catch (err) {
    addMessage('sistema', '⚠ Error: ' + err.message);
  }
}

// ── Modal memoria ─────────────────────────────────────────────────────────────
async function openModal() {
  document.getElementById('modal').classList.add('open');
  const resp = await fetch('/memoria/stats');
  const s = await resp.json();
  document.getElementById('modal-stats').innerHTML = `
    <div class="stat-row"><span class="label">Historial activo</span><span class="value">${s.turnos_historial} turnos</span></div>
    <div class="stat-row"><span class="label">Largo plazo</span><span class="value">${s.entradas_largo_plazo} entradas</span></div>
    <div class="stat-row"><span class="label">Categorías</span><span class="value">${s.categorias.join(', ') || '—'}</span></div>
  `;
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }

async function cmdMemoria(accion) {
  closeModal();
  if (accion === 'buscar') {
    const query = prompt('Buscar en memoria:');
    if (!query) return;
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: `/memoria buscar ${query}` })
    });
    const data = await resp.json();
    addMessage('sistema', data.respuesta);
  } else if (accion === 'listar') {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: '/memoria listar' })
    });
    const data = await resp.json();
    addMessage('sistema', data.respuesta);
  } else if (accion === 'limpiar') {
    if (!confirm('¿Limpiar historial activo? Las memorias a largo plazo se mantienen.')) return;
    await fetch('/memoria/limpiar', { method: 'POST' });
    addMessage('sistema', 'Historial limpiado.');
  }
}
