<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — persistent memory agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0b;
    --surface:   #111114;
    --border:    #1e1e24;
    --border2:   #2a2a33;
    --text:      #e2e0d8;
    --muted:     #666670;
    --accent:    #c8a96e;
    --accent2:   #7c6fcd;
    --gemelo:    #1a1a20;
    --user:      #141418;
    --danger:    #c06060;
    --success:   #6a9e6a;
    --radius:    12px;
    --font-ui:   'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-title {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .header-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-icon:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-icon.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(124, 111, 205, 0.08);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    gap: 4px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.gemelo { align-self: flex-start; align-items: flex-start; }
  .msg.sistema { align-self: center; align-items: center; }

  .msg-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 4px;
  }

  .msg.user .msg-label { color: var(--accent); }
  .msg.gemelo .msg-label { color: var(--accent2); }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-bubble {
    background: var(--user);
    border: 1px solid var(--border2);
    border-bottom-right-radius: 3px;
  }

  .msg.gemelo .msg-bubble {
    background: var(--gemelo);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  .msg.sistema .msg-bubble {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
  }

  .msg-bubble img {
    max-width: 280px;
    max-height: 200px;
    border-radius: 8px;
    display: block;
    margin-bottom: 8px;
    object-fit: contain;
  }

  .msg.gemelo .msg-bubble em,
  .msg.gemelo .msg-bubble i {
    color: var(--muted);
    font-style: italic;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: var(--gemelo);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 3px;
    width: fit-content;
  }

  .thinking span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.2s ease-in-out infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  #drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 11, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--accent);
    font-family: var(--font-ui);
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  #drop-overlay.active { display: flex; }

  #img-preview-bar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #img-preview-bar.visible { display: flex; }

  #img-preview-bar img {
    height: 48px;
    width: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border2);
  }

  #img-preview-bar .img-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }

  #img-preview-bar button {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #input-wrap {
    flex: 1;
    position: relative;
  }

  #msg-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: var(--radius);
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }

  #msg-input:focus { border-color: var(--accent2); }
  #msg-input::placeholder { color: var(--muted); }

  .send-btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    width: 46px;
    height: 46px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 18px;
  }

  .send-btn:hover { background: #d4b87a; transform: scale(1.03); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .attach-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    width: 46px;
    height: 46px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 18px;
  }

  .attach-btn:hover { border-color: var(--accent); color: var(--accent); }

  #file-input { display: none; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 6px;
    letter-spacing: 0.04em;
  }

  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  #modal.open { display: flex; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-height: 70vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-box h2 {
    font-family: var(--font-ui);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .stat-row .label { color: var(--muted); }
  .stat-row .value { color: var(--accent); font-weight: 500; }

  .modal-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .modal-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .modal-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    align-self: flex-end;
    margin-top: -8px;
  }

  #cam-video { display: none; }
  #cam-canvas { display: none; }
</style>
</head>
<body>

<div id="drop-overlay">
  <span>Drop image here</span>
</div>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="cam-canvas"></canvas>

<header>
  <div class="header-left">
    <div class="status-dot"></div>
    <div>
      <div class="header-title">Recall</div>
      <div class="header-sub">persistent memory agent</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btn-verbose" onclick="toggleVerbose()">verbose</button>
    <button class="btn-icon" onclick="openModal()">memory</button>
    <button class="btn-icon" onclick="cerrarSesion()" style="border-color: #c06060; color: #c06060;">end session</button>
  </div>
</header>

<div id="chat">
  <div class="msg sistema">
    <div class="msg-bubble">Recall active. Start typing — I remember everything.</div>
  </div>
</div>

<div id="img-preview-bar">
  <img id="img-preview-thumb" src="" alt="preview">
  <span class="img-name" id="img-preview-name">image.png</span>
  <button onclick="clearImage()" title="Remove image">&#10007;</button>
</div>

<div id="input-area">
  <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach image">
    &#128247;
  </button>
  <input type="file" id="file-input" accept="image/*" onchange="handleFileInput(this)">
  <div id="input-wrap">
    <textarea
      id="msg-input"
      placeholder="Type a message... (Ctrl+V to paste image)"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
  </div>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">&#8593;</button>
</div>
<div class="hint">Enter to send &middot; Shift+Enter for new line &middot; Ctrl+V to paste image</div>

<div id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&#10007;</button>
    <h2>Memory</h2>
    <div id="modal-stats">Loading...</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="modal-btn" onclick="cmdMemoria('buscar')">&#128269; Search memory</button>
      <button class="modal-btn" onclick="cmdMemoria('listar')">&#128203; List recent memories</button>
      <button class="modal-btn danger" onclick="cmdMemoria('limpiar')">&#9888; Clear active history</button>
    </div>
  </div>
</div>

<script>
let pendingImage = null;
let verboseOn    = false;
let sending      = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      loadImageFile(file);
      return;
    }
  }
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.add('active');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) {
    document.getElementById('drop-overlay').classList.remove('active');
  }
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    loadImageFile(file);
  }
});

function handleFileInput(input) {
  const file = input.files[0];
  if (file) loadImageFile(file);
  input.value = '';
}

function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const b64 = dataUrl.split(',')[1];
    pendingImage = {
      b64,
      mediaType: file.type || 'image/png',
      name: file.name || 'image.png',
      previewUrl: dataUrl
    };
    showImagePreview();
  };
  reader.readAsDataURL(file);
}

function showImagePreview() {
  if (!pendingImage) return;
  document.getElementById('img-preview-thumb').src = pendingImage.previewUrl;
  document.getElementById('img-preview-name').textContent = pendingImage.name;
  document.getElementById('img-preview-bar').classList.add('visible');
}

function clearImage() {
  pendingImage = null;
  document.getElementById('img-preview-bar').classList.remove('visible');
  document.getElementById('img-preview-thumb').src = '';
}

async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('msg-input');
  const texto = input.value.trim();

  if (!texto && !pendingImage) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;

  const displayText = texto || '(image)';
  addMessage('user', displayText, pendingImage?.previewUrl);

  input.value = '';
  input.style.height = 'auto';

  const thinkingId = addThinking();

  try {
    let data;

    if (pendingImage) {
      const resp = await fetch('/imagen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imagen_b64: pendingImage.b64,
          media_type: pendingImage.mediaType,
          mensaje: texto || 'What do you see in this image?'
        })
      });
      data = await resp.json();
      clearImage();
    } else {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto })
      });
      data = await resp.json();
    }

    removeThinking(thinkingId);

    if (data.tipo === 'error') {
      addMessage('sistema', '&#9888; ' + data.respuesta);
    } else if (data.tipo === 'comando') {
      addMessage('sistema', data.respuesta);
    } else {
      addMessage('gemelo', data.respuesta);
    }

  } catch (err) {
    removeThinking(thinkingId);
    addMessage('sistema', '&#9888; Connection error: ' + err.message);
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

function addMessage(tipo, texto, imgUrl) {
  const chat = document.getElementById('chat');

  const div = document.createElement('div');
  div.className = `msg ${tipo}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = tipo === 'user' ? 'You' : tipo === 'gemelo' ? 'Recall' : 'System';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    bubble.appendChild(img);
  }

  const formatted = texto.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const textNode = document.createElement('span');
  textNode.innerHTML = formatted;
  bubble.appendChild(textNode);

  div.appendChild(label);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

let thinkingCounter = 0;

function addThinking() {
  const chat = document.getElementById('chat');
  const id = 'thinking-' + (++thinkingCounter);

  const wrapper = document.createElement('div');
  wrapper.className = 'msg gemelo';
  wrapper.id = id;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Recall';

  const dots = document.createElement('div');
  dots.className = 'thinking';
  dots.innerHTML = '<span></span><span></span><span></span>';

  wrapper.appendChild(label);
  wrapper.appendChild(dots);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;

  return id;
}

function removeThinking(id) {
  document.getElementById(id)?.remove();
}

async function toggleVerbose() {
  await fetch('/verbose', { method: 'POST' });
  verboseOn = !verboseOn;
  const btn = document.getElementById('btn-verbose');
  btn.classList.toggle('active', verboseOn);
  addMessage('sistema', `Verbose: ${verboseOn ? 'ON' : 'OFF'}`);
}

async function cerrarSesion() {
  if (!confirm('End session? History will be summarized and archived.')) return;
  addMessage('sistema', 'Closing session...');
  try {
    const resp = await fetch('/cerrar_sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: 'user' })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      addMessage('sistema', 'Session closed. Summary saved.');
    } else {
      addMessage('sistema', 'Error: ' + data.mensaje);
    }
  } catch (err) {
    addMessage('sistema', 'Error: ' + err.message);
  }
}

async function openModal() {
  document.getElementById('modal').classList.add('open');
  const resp = await fetch('/memoria/stats');
  const s = await resp.json();
  document.getElementById('modal-stats').innerHTML = `
    <div class="stat-row"><span class="label">Active history</span><span class="value">${s.turnos_historial} turns</span></div>
    <div class="stat-row"><span class="label">Long-term memory</span><span class="value">${s.entradas_largo_plazo} entries</span></div>
    <div class="stat-row"><span class="label">Categories</span><span class="value">${s.categorias.join(', ') || '—'}</span></div>
  `;
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }

async function cmdMemoria(accion) {
  closeModal();
  if (accion === 'buscar') {
    const query = prompt('Search memory:');
    if (!query) return;
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: `/memory search ${query}` })
    });
    const data = await resp.json();
    addMessage('sistema', data.respuesta);
  } else if (accion === 'listar') {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: '/memory list' })
    });
    const data = await resp.json();
    addMessage('sistema', data.respuesta);
  } else if (accion === 'limpiar') {
    if (!confirm('Clear active history? Long-term memories are kept.')) return;
    await fetch('/memoria/limpiar', { method: 'POST' });
    addMessage('sistema', 'History cleared.');
  }
}
</script>
</body>
</html>
